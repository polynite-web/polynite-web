function prepareTutorialDocument(input, tailSupported, interactive = false) {
  const document = structuredClone(input);
  if (interactive) document.seq = document.seq.filter(clip => clip.branding_slot !== 'outro');
  if (tailSupported) return document;
  const tails = document.seq.filter(clip => clip.branding_slot === 'outro' && clip.branding_tail > 0);
  for (const clip of tails) {
    const start = clip.at, duration = clip.dur;
    delete clip.branding_slot;
    delete clip.branding_tail;
    document.seq.push({op:'set',at:start,dur:Math.min(.7,duration),film_fade:1});
    document.seq.push({op:'hold',at:start,dur:duration});
  }
  return document;
}
function restoreTutorialCues(seq, reference, includeOutro) {
  const copy = structuredClone(seq);
  for (const cue of reference.seq.filter(clip => (clip.op === 'sound' || clip.branding_slot) && (includeOutro || clip.branding_slot !== 'outro'))) {
    if (!copy.some(clip => clip.op === cue.op && clip.branding_slot === cue.branding_slot && (cue.branding_slot || ((clip.at || 0) === (cue.at || 0) && JSON.stringify(clip.play) === JSON.stringify(cue.play))))) copy.push(structuredClone(cue));
  }
  return copy;
}
const frame=document.querySelector('iframe'),status=document.querySelector('#status'),replay=document.querySelector('#replay'),save=document.querySelector('#save'),stop=document.querySelector('#stop'),download=document.querySelector('#download');let engine,reference,downloadUrl,transportTimer;
function watchTransport(){clearInterval(transportTimer);const silent=!engine.call('scene.describe').sound?.live;transportTimer=setInterval(()=>{try{const film=engine.call('scene.cinematic',{request:{command:'status'}});if(!film.playing){clearInterval(transportTimer);console.info('[tutorial-effects]',JSON.stringify({impacts:engine.call('scene.physics',{request:{command:'status'}}).impact_sounds,live:engine.call('scene.describe').sound?.live}));status.textContent='Film finished. Replay it, or stop to return to editing.';}else status.textContent='Playing · '+film.time.toFixed(1)+' / '+film.duration.toFixed(1)+' s'+(silent?' · silent preview':'');}catch(error){clearInterval(transportTimer);status.textContent=error.message;}},500);}
const until=Date.now()+90000;const timer=setInterval(async()=>{try{engine=frame.contentWindow.polynite;if(!engine?.call){if(Date.now()>until){clearInterval(timer);status.textContent='Viewer did not become ready. Check WebGPU support or download the scene copy.';}return;}if(engine.call('scene.cinematic',{request:{command:'status'}}).export.active)throw Error('Viewer is busy');clearInterval(timer);const response=await fetch("/docs/media/tutorials/r4/block-explosion-2a14599566f3.scene");if(!response.ok)throw Error('Scene download failed');reference=await response.json();const document=prepareTutorialDocument(reference,engine.call('scene.cinematic',{request:{command:'status'}}).branding?.outro_tail_supported,true);if(!engine.call('scene.describe').sound?.live&&!engine.call('scene.capabilities').cinematic?.branding)document.seq=document.seq.filter(clip=>clip.op!=='sound');engine.call('scene.cinematic',{request:{command:'load_document',document,start_paused:true}});engine.call('scene.cinematic',{request:{command:'seek',time:0}});replay.disabled=false;save.disabled=false;stop.disabled=false;status.textContent='Explore and edit this temporary copy. Save your version before closing.';}catch(error){clearInterval(timer);status.textContent='Could not open the tutorial: '+error.message+' — download the scene copy to try locally.';}if(Date.now()>until){clearInterval(timer);status.textContent='Viewer did not become ready. Check WebGPU support or download the scene copy.';}},250);
replay.addEventListener('click',async()=>{replay.disabled=true;try{status.textContent='Starting scene audio…';const viewer=frame.contentWindow;const awakened=viewer.vmeshAudioGesture?await viewer.vmeshAudioGesture():false;console.info('[tutorial-audio]',JSON.stringify({awakened,live:engine.call('scene.describe').sound?.live}));const readyUntil=Date.now()+2000;while(!engine.call('scene.describe').sound?.live&&Date.now()<readyUntil)await new Promise(resolve=>setTimeout(resolve,50));engine.call('scene.cinematic',{request:{command:'stop'}});const live=engine.call('scene.describe').sound?.live;if(live){const current=engine.call('scene.cinematic',{request:{command:'document'}});engine.call('scene.cinematic',{request:{command:'replace',seq:restoreTutorialCues(current.seq,reference,false)}});}else status.textContent='Sound is muted. Enable it in the viewer to hear scene effects.';if(engine.call('scene.physics',{request:{command:'status'}}).body_count){engine.call('scene.physics',{request:{command:'resume'}});engine.call('scene.cinematic',{request:{command:'capture'}});}engine.call('scene.cinematic',{request:{command:'play'}});watchTransport();}catch(error){status.textContent=error.message;}finally{replay.disabled=false;}});
stop.addEventListener('click',()=>{clearInterval(transportTimer);try{engine.call('scene.cinematic',{request:{command:'stop'}});status.textContent='Explore and edit this temporary copy. Save your version before closing.';}catch(error){status.textContent=error.message;}});
save.addEventListener('click',()=>{try{const snapshot=engine.call('scene.cinematic',{request:{command:'document'}});const copy={version:snapshot.version,model:snapshot.model,initial:snapshot.initial,seq:snapshot.seq,title:"A burst of colour — my version"};if(snapshot.initial.film_branding_mode!==1 && copy.seq.length)copy.seq=restoreTutorialCues(copy.seq,reference,true);copy.export={};for(const key of ['fps','resolution','encoder','quality','watermark'])if(snapshot.export?.[key]!==undefined)copy.export[key]=snapshot.export[key];const url=URL.createObjectURL(new Blob([JSON.stringify(copy)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download="block-explosion-my-version.scene";if(downloadUrl)URL.revokeObjectURL(downloadUrl);downloadUrl=url;download.href=url;download.download=link.download;download.hidden=false;download.click();status.textContent='Your scene copy is ready. Use Download my version if the download did not start.';}catch(error){status.textContent='Stop the film before saving your version. '+error.message;}});
